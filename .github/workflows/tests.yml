name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      # Full suite includes tests that need a live enrichment cache (real
      # OpenAI calls) -- those self-skip via pytest.mark/skip when the
      # cache isn't present, so CI runs the deterministic majority: parser,
      # graph, design-checks logic, workspace validation, chat memory
      # ranking. No secrets required, nothing here calls a live API.
      - run: ruff check schemantic tests
      - run: pytest -q
