# Reverse proxy for schemantic.ashutoshrath.me -> the Docker container's
# published port 8000. Not wired into docker-compose.yml on purpose: nginx
# and certbot run on the host, outside the container, since a container
# restart shouldn't take the TLS cert down with it.
#
# One-time setup on the EC2 host, once the DNS A record for
# schemantic.ashutoshrath.me points at this instance:
#
#   sudo apt-get install -y nginx certbot python3-certbot-nginx
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/schemantic
#   sudo ln -s /etc/nginx/sites-available/schemantic /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d schemantic.ashutoshrath.me
#
# certbot rewrites this file in place to add the TLS server block and a
# port-80-to-443 redirect -- the http-only block below is only what's
# needed before that first run.

server {
    listen 80;
    server_name schemantic.ashutoshrath.me;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
