services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      # enrichment cache, fetched datasheets, workspace.json, and the
      # chat-memory SQLite DB all live here -- named volume so a container
      # rebuild doesn't lose them (re-enriching a board costs real API spend)
      - schemantic_cache:/app/.cache
    restart: unless-stopped

volumes:
  schemantic_cache:
